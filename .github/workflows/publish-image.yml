# Build the Forma image for this commit. The preview URL stays on Vercel.
# This file is copied into Awannaphasch2016/forma. It must not receive secrets.
name: Publish Forma image

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/forma-preview-walkthrough

permissions:
  contents: read
  packages: write

concurrency:
  group: forma-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/awannaphasch2016/forma:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Report the digest
        run: |
          set -euo pipefail
          echo "forma_image=ghcr.io/awannaphasch2016/forma@${{ steps.build.outputs.digest }}"
