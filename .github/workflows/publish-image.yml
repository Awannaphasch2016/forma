# Build the Forma image for the role-pause commit.
# Log in as the repository owner so the package stays on that account.
name: Publish Forma image

on:
  push:
    branches:
      - cursor/forma-hitl-image-5014

permissions:
  contents: read
  packages: write

concurrency:
  group: forma-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/awannaphasch2016/forma:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Report the digest
        run: |
          set -euo pipefail
          echo "forma_image=ghcr.io/awannaphasch2016/forma@${{ steps.build.outputs.digest }}"
